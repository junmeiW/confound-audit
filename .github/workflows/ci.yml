name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -v

  minimum-versions:
    name: minimum dependency versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      # The declared floors in setup.cfg must actually work. These are the
      # versions the package was developed and verified against locally.
      - name: Install floor versions
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==1.20.3" "pandas==1.3.4" "scipy==1.7.1"
          python -m pip install -e . --no-deps
          python -m pip install "pytest>=6.0"

      - name: Show resolved versions
        run: python -c "import numpy, pandas, scipy; print(numpy.__version__, pandas.__version__, scipy.__version__)"

      - name: Run tests
        run: python -m pytest -v

  build-and-install:
    name: build wheel and verify the installed artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Build sdist and wheel
        run: python -m build

      # Guards against the failure mode where metadata is silently ignored and
      # the artifact is produced as UNKNOWN-0.0.0 containing no packages.
      - name: Assert the artifact is correctly named
        run: |
          ls -l dist/
          if ls dist/ | grep -qi "unknown"; then
            echo "::error::wheel was built as UNKNOWN — project metadata is not being read"
            exit 1
          fi
          test -f dist/confound_audit-0.1.0-py3-none-any.whl

      - name: Check package metadata
        run: python -m twine check dist/*

      # Install the wheel into a clean environment (not the source tree) so the
      # test exercises the packaged code, not the working copy.
      - name: Install wheel into a clean venv
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/python -m pip install --upgrade pip
          /tmp/clean/bin/python -m pip install dist/confound_audit-0.1.0-py3-none-any.whl

      - name: Verify the console entry point works
        run: |
          /tmp/clean/bin/confound-audit --version
          /tmp/clean/bin/confound-audit demo --n_perm 50 --format md --out /tmp/demo.md
          test -s /tmp/demo.md
          grep -q "Confound audit report" /tmp/demo.md

      - name: Import check from outside the source tree
        working-directory: /tmp
        run: |
          /tmp/clean/bin/python -c "
          import confound_audit as ca
          print('version', ca.__version__)
          print('exports', len(ca.__all__))
          assert 'audit' in ca.__all__
          "

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: python -m pip install ruff
      - name: Ruff
        run: ruff check src tests
