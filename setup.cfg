[metadata]
name = confound-audit
version = 0.1.0
description = Detect input-composition confounds in mutation-induced embedding analyses before interpreting them as model findings.
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
license_files = LICENSE
author = Junmei Wang
author_email = junmeiW@users.noreply.github.com
url = https://github.com/junmeiW/confound-audit
project_urls =
    Source = https://github.com/junmeiW/confound-audit
    Issues = https://github.com/junmeiW/confound-audit/issues
    Changelog = https://github.com/junmeiW/confound-audit/blob/main/CHANGELOG.md
keywords = protein-language-models, embeddings, confounding, deep-mutational-scanning, reproducibility, statistics
classifiers =
    Development Status :: 3 - Alpha
    Intended Audience :: Science/Research
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Topic :: Scientific/Engineering :: Bio-Informatics

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.8
install_requires =
    numpy>=1.20
    pandas>=1.2
    scipy>=1.6

[options.packages.find]
where = src

[options.extras_require]
plot =
    matplotlib>=3.4
dev =
    pytest>=6.0
    pytest-cov

[options.entry_points]
console_scripts =
    confound-audit = confound_audit.cli:main
